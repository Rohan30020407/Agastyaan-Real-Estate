<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100">

  <div id="navbar"></div>

  <div class="mt-24 mx-4 mb-8 bg-gray-100 text-[#FFD700] shadow-lg border-2 border-black grid grid-cols-1 md:grid-cols-2 items-start rounded-lg overflow-hidden">

    <!-- CONTACT US heading -->
    <h1 class="col-span-1 md:col-span-2 text-center text-xl font-bold text-black my-5">
      CONTACT US
    </h1>

    <!-- Left -->
    <div class="text-center text-black bg-gray-200 w-[95%] mx-auto mt-5 min-h-[250px] px-4 py-6">
      <h2 class="mt-4 text-lg font-semibold">GET IN TOUCH</h2>

      <h6 class="mt-5 text-sm">
        Have a problem in mind? Let's talk and build something amazing together!
      </h6>

      <div class="flex flex-col sm:flex-row justify-center gap-6 mt-10">

        <div class="flex flex-col items-center">
          <i class="fa-solid fa-envelope text-black text-lg"></i>
          <h2 class="text-black mt-1 text-sm font-semibold">Email</h2>
          <p class="text-black text-xs">agastyaantechnology@gmail.com</p>
        </div>

        <div class="flex flex-col items-center">
          <i class="fa-solid fa-phone text-black text-lg"></i>
          <h2 class="text-black mt-1 text-sm font-semibold">Phone</h2>
          <p class="text-black text-xs">90150-63566</p>
        </div>

        <div class="flex flex-col items-center">
          <i class="fa-solid fa-location-dot text-black text-lg"></i>
          <h2 class="text-black mt-1 text-sm font-semibold">Location</h2>
          <p class="text-black text-xs">India</p>
        </div>

      </div>
    </div>

    <!-- Right Form -->
    <form id="contactForm" class="contents">

      <!-- Name + Email -->
      <div class="flex flex-col ml-0 md:ml-[10px] px-4 md:px-0">

        <label class="mt-3 text-black font-medium">
          Your Name
        </label>

        <input 
          type="text"
          id="name"
          placeholder="Enter your name here"
          class="w-[95%] mt-2 h-[60px] border border-gray-300 px-3 rounded outline-none focus:border-yellow-400"
        >

        <span id="nameError" class="text-red-500 text-sm mt-1"></span>

        <label class="mt-4 text-black font-medium">
          Your Email
        </label>

        <input 
          type="email"
          id="email"
          placeholder="Enter your mail here"
          class="w-[95%] mt-2 h-[60px] border border-gray-300 px-3 rounded outline-none focus:border-yellow-400"
        >

        <span id="emailError" class="text-red-500 text-sm mt-1"></span>

      </div>

      <!-- Empty -->
      <div class="hidden md:block"></div>

      <!-- Message -->
      <div class="px-4 md:px-0 md:ml-[10px] mb-5">

        <label class="mt-1 text-black font-medium">
          Your Message
        </label>

        <textarea 
          id="message"
          placeholder="Enter your message here"
          class="w-[95%] mt-2 h-[200px] border border-gray-300 px-3 py-2 rounded outline-none focus:border-yellow-400 resize-none block"
        ></textarea>

        <span id="messageError" class="text-red-500 text-sm mt-1"></span>

        <button 
          type="submit"
          class="bg-[#FFD700] mt-5 w-[95%] text-black rounded-lg mb-5 h-[70px] font-semibold hover:bg-yellow-500 transition"
        >
          <i class="fa-solid fa-paper-plane mr-2"></i>
          Send Message
        </button>

      </div>

    </form>

  </div>

  <div id="footer"></div>

  <script>
    const form = document.getElementById("contactForm");

    form.addEventListener("submit", function(e){

      e.preventDefault();

      
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

     
      const nameError = document.getElementById("nameError");
      const emailError = document.getElementById("emailError");
      const messageError = document.getElementById("messageError");

     
      nameError.innerText = "";
      emailError.innerText = "";
      messageError.innerText = "";

      let isValid = true;


      if(name === ""){
        nameError.innerText = "Name is required";
        isValid = false;
      }

     
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      if(email === ""){
        emailError.innerText = "Email is required";
        isValid = false;
      }
      else if(!email.match(emailPattern)){
        emailError.innerText = "Enter valid email";
        isValid = false;
      }

      
      if(message === ""){
        messageError.innerText = "Message is required";
        isValid = false;
      }
      else if(message.length < 10){
        messageError.innerText = "Message must be at least 10 characters";
        isValid = false;
      }

     
      if(isValid){
        alert("Message Sent Successfully ✅");

        form.reset();
      }

    });





    fetch("../components/navbar.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("navbar").innerHTML = data;

          const btn  = document.getElementById("menuBtn");
          const menu = document.getElementById("mobileMenu");

          if (btn && menu) {

            btn.addEventListener("click", () => {

              const isHidden = menu.classList.contains("hidden");

              if (isHidden) {
                menu.classList.remove("hidden");
                menu.classList.add("flex"); // important
              }

              else {
                menu.classList.add("hidden");
                menu.classList.remove("flex");
              }

            });

          }
      });

    

    fetch("../components/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });

  </script>

</body>
</html>
