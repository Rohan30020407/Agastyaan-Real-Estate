<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Property</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen min-w-[400px]">
  <div id="navbar"></div>

  <main class="max-w-4xl mx-auto pt-28 pb-10 px-4 w-full min-w-[400px]">
    <div class="bg-white shadow-lg rounded-2xl p-6 md:p-8">
      <h1 class="text-3xl font-bold mb-2">Post Property</h1>
      <p class="text-gray-500 mb-6">Add your property for rent or sale.</p>

      <form id="postPropertyForm" class="grid md:grid-cols-2 gap-4">
        <input name="title" required placeholder="Property title" class="border p-3 rounded-lg w-full min-w-[300px]" />
        <input name="price" required type="number" min="1" placeholder="Price" class="border p-3 rounded-lg w-full" />
        <input name="location" required placeholder="Location" class="border p-3 rounded-lg w-full" />
        <select name="type" required class="border p-3 rounded-lg w-full">
          <option value="">Select type</option>
          <option value="sale">Sale</option>
          <option value="rent">Rent</option>
        </select>
        <input name="amenities" placeholder="Amenities (comma separated)" class="border p-3 rounded-lg md:col-span-2" />
        <input name="images" type="file" multiple accept="image/*" class="border p-3 rounded-lg md:col-span-2" />
        <textarea name="description" required placeholder="Description" rows="4" class="border p-3 rounded-lg md:col-span-2"></textarea>
        <button class="bg-black text-yellow-400 px-5 py-3 rounded-lg font-semibold hover:bg-gray-800 transition md:col-span-2">Submit Property</button>
      </form>
      <p id="msg" class="mt-3 text-sm"></p>
    </div>
  </main>

  <div id="footer"></div>

  <script>
  fetch("../components/navbar.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar").innerHTML = data;

      const btn  = document.getElementById("menuBtn");
      const menu = document.getElementById("mobileMenu");

      if (btn && menu) {

        btn.addEventListener("click", () => {

          const isHidden = menu.classList.contains("hidden");

          if (isHidden) {
            menu.classList.remove("hidden");
            menu.classList.add("flex"); // important
          }

          else {
            menu.classList.add("hidden");
            menu.classList.remove("flex");
          }

        });

      }
    });

  fetch("../components/footer.html")
    .then(r => r.text())
    .then(html => document.getElementById("footer").innerHTML = html);

  const form = document.getElementById("postPropertyForm");
  const msg = document.getElementById("msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const token = localStorage.getItem("admin_token");

    if (!token) {
      msg.textContent = "Please login as admin/sub-admin first.";
      msg.className = "mt-3 text-sm text-red-600";
      return;
    }

    const fd = new FormData();

    fd.append("title", form.title.value.trim());
    fd.append("price", form.price.value);
    fd.append("location", form.location.value.trim());
    fd.append("type", form.type.value);
    fd.append("description", form.description.value.trim());
    fd.append("amenities", form.amenities.value.trim());

    for (const file of form.images.files) {
      fd.append("images", file);
    }

    msg.textContent = "Submitting...";
    msg.className = "mt-3 text-sm text-gray-600";

    try {

      const res = await fetch("http://localhost:4000/api/properties", {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`
        },
        body: fd
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "Failed to post property");
      }

      form.reset();

      msg.textContent = "Property posted successfully.";
      msg.className = "mt-3 text-sm text-green-600";

    } 
    
    catch (err) {

      msg.textContent = err.message;
      msg.className = "mt-3 text-sm text-red-600";

    }

  });
</script>
</body>
</html>
